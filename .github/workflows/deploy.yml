name: Deploy Release Artifact

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: choice
        default: Test
        options: [Test, Prod]
      version:
        description: Release tag, for example v1.2.3. Empty means the latest release tag of the selected branch or the selected tag itself
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Deployments to one Function App must not overlap: Kudu rejects a package while another one is being deployed
    concurrency:
      group: timesheet-bot-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The whole history with tags is needed to find the latest release tag of the selected branch
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -z "$VERSION" ]]; then
            if [[ "$REF_TYPE" == 'tag' ]]; then
              VERSION="$REF_NAME"
            else
              VERSION="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)" || { echo "No release tag is reachable from '$REF_NAME'" >&2; exit 1; }
              if [[ "$(git rev-parse "$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]]; then
                echo "::notice::'$REF_NAME' has commits after $VERSION. They are not released and will not be deployed."
              fi
            fi
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Unexpected version: $VERSION" >&2; exit 1; }
          echo "Deploying $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The scripts of the release are used, not the scripts of the selected branch
          git checkout --detach "refs/tags/$VERSION"
      - name: Download release artifact from Azure Blob Storage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ vars.AZURE_ARTIFACT_NAME }}
          ARTIFACT_CONTAINER: ${{ vars.AZURE_ARTIFACT_CONTAINER_NAME }}
          ARTIFACT_ACCOUNT: ${{ vars.AZURE_ARTIFACT_ACCOUNT_NAME }}
          ARTIFACT_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY_ARTIFACT }}
        run: |
          mkdir -p ./publish
          az storage blob download --name "${ARTIFACT_NAME}-${VERSION}.zip" --file "./publish/${ARTIFACT_NAME}-${VERSION}.zip" --account-name "$ARTIFACT_ACCOUNT" --container-name "$ARTIFACT_CONTAINER" --account-key "$ARTIFACT_ACCOUNT_KEY" --only-show-errors
      - name: Validate release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ vars.AZURE_ARTIFACT_NAME }}
        run: bash .infra/scripts/validate-function-package.sh "./publish/${ARTIFACT_NAME}-${VERSION}.zip"
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOY_SUBSCRIPTION_ID }}
      - name: Validate Function App runtime
        uses: azure/cli@v3
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          FUNCTION_APP: ${{ vars.FUNCTION_APP_NAME }}
        with:
          inlineScript: |
            runtime="$(az functionapp config show --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP" --query linuxFxVersion --output tsv --only-show-errors)"
            [[ "$runtime" == 'DOTNET-ISOLATED|10.0' ]] || { echo "Unexpected Function runtime: $runtime" >&2; exit 1; }
      - name: Deploy release artifact
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: ./publish/${{ vars.AZURE_ARTIFACT_NAME }}-${{ steps.version.outputs.version }}.zip
      - name: Publish agent prompt
        uses: azure/cli@v3
        env:
          AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          AGENT_PROMPT_CONTAINER_NAME: ${{ vars.AGENT_PROMPT_CONTAINER_NAME }}
          AGENT_PROMPT_BLOB_NAME: ${{ vars.AGENT_PROMPT_BLOB_NAME }}
          PACKAGE_PATH: ./publish/${{ vars.AZURE_ARTIFACT_NAME }}-${{ steps.version.outputs.version }}.zip
        with:
          inlineScript: bash .infra/scripts/publish-agent-prompt.sh
      - name: Record deployment time
        uses: azure/cli@v3
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          FUNCTION_APP: ${{ vars.FUNCTION_APP_NAME }}
        with:
          inlineScript: az functionapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP" --settings "Info__DeployDateTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --output none --only-show-errors
      - name: Azure logout
        if: ${{ always() }}
        uses: azure/cli@v3
        with:
          inlineScript: az logout

  health:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOY_SUBSCRIPTION_ID }}
      - name: Resolve health function key
        id: health
        uses: azure/cli@v3
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          FUNCTION_APP: ${{ vars.FUNCTION_APP_NAME }}
        with:
          inlineScript: |
            key="$(az functionapp function keys list --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP" --function-name HealthCheck --query default --output tsv --only-show-errors)"
            [[ -n "$key" ]] || { echo 'HealthCheck function key was not found' >&2; exit 1; }
            echo "::add-mask::$key"
            echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Ping health endpoint
        uses: GarageGroup/platform-ping-app@v0.1.0
        with:
          health_check_url: https://${{ vars.FUNCTION_APP_NAME }}.azurewebsites.net/health?code=${{ steps.health.outputs.key }}
          contains: ${{ needs.deploy.outputs.version }}
          is_end_of_line_match: true
          retry_delay_in_seconds: 15
          max_attempts: 30
      - name: Azure logout
        if: ${{ always() }}
        uses: azure/cli@v3
        with:
          inlineScript: az logout
