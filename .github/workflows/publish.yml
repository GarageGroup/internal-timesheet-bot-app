name: Publish Release

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Add Garage Group NuGet source
        run: >
          dotnet nuget add source "${{ vars.GG_NUGET_SOURCE_URL }}"
          --name garage
          --username "${{ secrets.GG_NUGET_SOURCE_USER_NAME }}"
          --password "${{ secrets.GG_NUGET_SOURCE_USER_PASSWORD }}"
          --store-password-in-clear-text
      - name: Restore
        run: dotnet restore Internal.Timesheet.Bot.slnx
      - name: Build
        run: dotnet build Internal.Timesheet.Bot.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Internal.Timesheet.Bot.slnx --no-build --no-restore --configuration Release
      - name: Publish Function App
        run: dotnet publish src/AzureFunc/AzureFunc.csproj --configuration Release --runtime linux-x64 --self-contained false --output '${{ github.workspace }}/publish'
      - name: Resolve release information
        id: release
        run: |
          echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set artifact version metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_DATETIME: ${{ steps.release.outputs.datetime }}
        run: |
          jq --arg version "$VERSION" --arg date "$BUILD_DATETIME" \
            '.Info.ApiVersion = $version | .Info.BuildDateTime = $date' \
            ./publish/appsettings.json > ./publish/appsettings.tmp.json
          mv ./publish/appsettings.tmp.json ./publish/appsettings.json
      - name: Archive publish folder
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARTIFACT_NAME: ${{ vars.AZURE_ARTIFACT_NAME }}
        run: cd ./publish && zip -r "${ARTIFACT_NAME}-${VERSION}.zip" ./
      - name: Upload artifact to Azure Blob Storage
        uses: azure/cli@v3
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARTIFACT_NAME: ${{ vars.AZURE_ARTIFACT_NAME }}
          ARTIFACT_CONTAINER: ${{ vars.AZURE_ARTIFACT_CONTAINER_NAME }}
          ARTIFACT_ACCOUNT: ${{ vars.AZURE_ARTIFACT_ACCOUNT_NAME }}
          ARTIFACT_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY_ARTIFACT }}
        with:
          inlineScript: az storage blob upload --container-name "$ARTIFACT_CONTAINER" --file "./publish/${ARTIFACT_NAME}-${VERSION}.zip" --name "${ARTIFACT_NAME}-${VERSION}.zip" --account-name "$ARTIFACT_ACCOUNT" --account-key "$ARTIFACT_ACCOUNT_KEY" --overwrite true --only-show-errors

  deploy-to-test:
    needs: publish
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Download release artifact from Azure Blob Storage
        env:
          VERSION: ${{ github.event.release.tag_name }}
          ARTIFACT_NAME: ${{ vars.AZURE_ARTIFACT_NAME }}
          ARTIFACT_CONTAINER: ${{ vars.AZURE_ARTIFACT_CONTAINER_NAME }}
          ARTIFACT_ACCOUNT: ${{ vars.AZURE_ARTIFACT_ACCOUNT_NAME }}
          ARTIFACT_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY_ARTIFACT }}
        run: |
          mkdir -p ./publish
          az storage blob download --name "${ARTIFACT_NAME}-${VERSION}.zip" --file "./publish/${ARTIFACT_NAME}-${VERSION}.zip" --account-name "$ARTIFACT_ACCOUNT" --container-name "$ARTIFACT_CONTAINER" --account-key "$ARTIFACT_ACCOUNT_KEY" --only-show-errors
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOY_SUBSCRIPTION_ID }}
      - name: Deploy release artifact to Test
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: ./publish/${{ vars.AZURE_ARTIFACT_NAME }}-${{ github.event.release.tag_name }}.zip
      - name: Record deployment time
        uses: azure/cli@v3
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          FUNCTION_APP: ${{ vars.FUNCTION_APP_NAME }}
        with:
          inlineScript: az functionapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP" --settings "Info__DeployDateTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --output none --only-show-errors
      - name: Azure logout
        if: ${{ always() }}
        uses: azure/cli@v3
        with:
          inlineScript: az logout

  ping-test:
    needs: deploy-to-test
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOY_SUBSCRIPTION_ID }}
      - name: Resolve health function key
        id: health
        uses: azure/cli@v3
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          FUNCTION_APP: ${{ vars.FUNCTION_APP_NAME }}
        with:
          inlineScript: |
            key="$(az functionapp function keys list --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP" --function-name HealthCheck --query default --output tsv --only-show-errors)"
            [[ -n "$key" ]] || { echo 'HealthCheck function key was not found' >&2; exit 1; }
            echo "::add-mask::$key"
            echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Ping Test health endpoint
        uses: GarageGroup/platform-ping-app@v0.1.0
        with:
          health_check_url: https://${{ vars.FUNCTION_APP_NAME }}.azurewebsites.net/health?code=${{ steps.health.outputs.key }}
          contains: ${{ github.event.release.tag_name }}
          is_end_of_line_match: true
          retry_delay_in_seconds: 15
          max_attempts: 30
      - name: Azure logout
        if: ${{ always() }}
        uses: azure/cli@v3
        with:
          inlineScript: az logout
